# Runs every test suite and production build on each push and pull request, so a change that
# breaks the store, the admin or the catalog is caught before it reaches Vercel or Render.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: catalog-service (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/catalog-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: platform/catalog-service/pom.xml
      # Integration tests use the in-memory H2 profile: no MySQL or secrets needed.
      # PhotoSourcesTest also fails if a photo was added without `npm run images`.
      - run: ./mvnw -B -ntp verify

  node:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: storefront-react
            test: true
            build: true
          - service: admin-vue
            test: false
            build: true
          - service: leads-bff
            test: true
            build: false
    defaults:
      run:
        working-directory: platform/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/${{ matrix.service }}/package-lock.json
      - run: npm ci --no-fund --no-audit
      - if: matrix.test
        run: npm test
      - if: matrix.build
        run: npm run build
